<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Web Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="interactive_style.css">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">

            <h3 class="mb-4">Interactive Web Form</h3>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control">
                <div id="usernameError" class="error-text"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control">
                <div id="emailError" class="error-text"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control">
                <div id="passwordError" class="error-text"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control">
                <div id="confirmPasswordError" class="error-text"></div>
            </div>

            
            <div class="mb-3">

                <label class="form-label fw-bold">
                    Interesting Topics
                    <span id="topicError" class="error-text ms-2"></span>
                </label>

                <div class="form-check">
                    <input class="form-check-input topic" type="checkbox">
                    <label class="form-check-label">HTML</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input topic" type="checkbox">
                    <label class="form-check-label">CSS</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input topic" type="checkbox">
                    <label class="form-check-label">JavaScript</label>
                </div>

            </div>

            
            <div class="mb-3">

                <label class="form-label fw-bold">
                    Gender
                    <span id="genderError" class="error-text ms-2"></span>
                </label>

                <select id="gender" class="form-select">
                    <option value="">--</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

            </div>

            <button id="submitBtn" class="btn btn-primary">
                Submit
            </button>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="interactive_script.js"></script>

</body>
</html>
